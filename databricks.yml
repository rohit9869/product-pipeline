# Product Ecommerce Pipeline - Databricks Asset Bundle
bundle:
  name: product_pipeline

workspace:
  host: https://dbc-90165a02-8ee3.cloud.databricks.com
  profile: DEFAULT

resources:
  jobs:
    product_ecommerce_pipeline:
      name: product_ecommerce_pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./src/product_pipeline/bronze_notebook.ipynb
        - task_key: silver
          notebook_task:
            notebook_path: ./src/product_pipeline/silver_notebook.ipynb
          depends_on:
            - task_key: bronze
        - task_key: gold
          notebook_task:
            notebook_path: ./src/product_pipeline/gold_notebook.ipynb
          depends_on:
            - task_key: silver

targets:
  dev:
    mode: development