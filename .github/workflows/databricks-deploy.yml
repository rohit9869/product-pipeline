# Name of your automation
name: Databricks Bundle Deploy

# WHEN to run automatically
on:
  push:
    branches:
      - main          # Run when code pushed to main
  pull_request:
    branches:
      - main          # Run when PR created to main

# WHAT to do automatically
jobs:
  deploy:
    runs-on: ubuntu-latest    # Use Linux computer

    steps:
      # Step 1: Get your code from GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Databricks CLI
      - name: Install Databricks CLI
        run: curl -fsSL https://...

      # Step 3: Validate your bundle
      - name: Validate Bundle
        run: databricks bundle validate

      # Step 4: Deploy to Databricks automatically!
      - name: Deploy Bundle
        run: databricks bundle deploy --target dev